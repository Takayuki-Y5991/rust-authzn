[package]
name = "rust-authzn"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = {version =  "1.43.0", features = ["rt" ,"net", "macros", "rt-multi-thread"] }
async-trait = "0.1.87"
oauth2 = "5"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
redis = {version = "0.29", features = ["tokio-comp", "aio", "connection-manager"]}
serde_json = "1.0"

uuid = {version = "1.17.0", features = ["v7"]}
getrandom = "0.3.0"
thiserror = "2"
url = "2.5.0"

base64ct = "1.6.0"
sha2 = "0.10.8"
rand = "0.9.0"
urlencoding = "2.1.3"
cookie = {version="0.18", features = ["secure"]}


[dev-dependencies]
wiremock = "0.6"
testcontainers = { version = "0.23", features = ["blocking"] }
reqwest = {version = "0.12", features = ["json"]}
scopeguard = "1.2"
